<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sem 3 · Routine</title>
<style>
  :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#020617;color:#e5e7eb;display:flex;justify-content:center;min-height:100vh}
  .wrap{width:100%;max-width:960px;padding:18px}
  .card{background:#020617;border-radius:14px;padding:16px;border:1px solid rgba(148,163,184,0.16);box-shadow:0 10px 30px rgba(0,0,0,0.6)}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:12px}
  h1{margin:0;font-size:1.15rem}
  .pill{font-size:0.75rem;padding:6px 10px;border-radius:999px;border:1px solid rgba(99,102,241,0.18);color:#c7d2fe}
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  label{font-size:0.75rem;color:#9ca3af}
  input[type=date]{padding:6px;border-radius:8px;border:1px solid #374151;background:#020617;color:#e5e7eb}
  .btn{padding:6px 10px;border-radius:999px;border:1px solid #374151;background:transparent;color:inherit;cursor:pointer}
  .weekday-row{display:flex;gap:8px;overflow:auto;padding-bottom:6px;margin-bottom:8px}
  .wd{padding:6px 10px;border-radius:999px;border:1px solid #374151;background:transparent;color:#9ca3af;cursor:pointer;white-space:nowrap}
  .wd.active{background:rgba(99,102,241,0.18);color:#e5e7eb;border-color:#6366f1}
  .section{margin-top:8px}
  .routine{border-radius:10px;border:1px solid #1f2937;padding:6px;max-height:360px;overflow:auto;background:linear-gradient(180deg, rgba(10,12,20,0.6), #020617)}
  .row{display:grid;grid-template-columns:1.2fr 2.6fr auto;gap:8px;padding:8px;border-bottom:1px solid rgba(31,41,55,0.9);align-items:center;font-size:0.88rem}
  .row:last-child{border-bottom:none}
  .time{font-weight:600}
  .code{font-size:0.78rem;color:#a5b4fc}
  .meta{font-size:0.75rem;color:#9ca3af}
  .status{padding:4px 8px;border-radius:999px;border:1px solid #374151;background:transparent;cursor:pointer;min-width:56px;text-align:center}
  .s-p{background:rgba(34,197,94,0.14);border-color:#22c55e;color:#a7f3d0}
  .s-a{background:rgba(239,68,68,0.12);border-color:#ef4444;color:#fecaca}
  .s-u{border-style:dashed;color:#9ca3af}
  .legend{display:flex;gap:12px;font-size:0.78rem;color:#9ca3af;margin-top:6px}
  .report{margin-top:8px;border-radius:10px;border:1px solid #1f2937;padding:8px;font-size:0.88rem;background:#020617}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px;border-bottom:1px solid #111827;text-align:left}
  th{font-size:0.78rem;color:#9ca3af}
  tfoot td{font-weight:600;border-top:1px solid #1f2937}
  .subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-top:8px}
  .sub{padding:8px;border-radius:8px;border:1px solid #1f2937}
  .sub .c{color:#a5b4fc;font-size:0.78rem}
  .empty{padding:10px;text-align:center;color:#9ca3af}
  @media (max-width:640px){.row{grid-template-columns:1fr 2fr auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <header>
      <div>
        <h1>Sem 3 · Routine</h1>
        <div style="font-size:0.82rem;color:#9ca3af">Fixed timetable · Local attendance</div>
      </div>
      <div class="pill">Offline</div>
    </header>

    <div class="controls">
      <div>
        <label for="date">Date</label><br>
        <input id="date" type="date">
      </div>
      <div>
        <label>&nbsp;</label><br>
        <button id="today" class="btn">Today</button>
      </div>
      <div style="min-width:160px">
        <label>Day</label><br>
        <div id="daychip" style="padding:6px 10px;border-radius:999px;border:1px solid #374151;color:#e5e7eb">–</div>
      </div>
    </div>

    <div class="weekday-row" id="wds">
      <div class="wd" data-day="Monday">Mon</div>
      <div class="wd" data-day="Tuesday">Tue</div>
      <div class="wd" data-day="Wednesday">Wed</div>
      <div class="wd" data-day="Thursday">Thu</div>
      <div class="wd" data-day="Friday">Fri</div>
      <div class="wd" data-day="Saturday">Sat</div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:600">Classes</div>
        <div id="mode" style="font-size:0.82rem;color:#9ca3af"></div>
      </div>

      <div class="legend">
        <div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#22c55e;margin-right:6px"></span> P</div>
        <div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#ef4444;margin-right:6px"></span> A</div>
        <div><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b7280;margin-right:6px"></span> –</div>
      </div>

      <div class="routine" id="routine"></div>
      <div class="empty" id="empt" style="display:none">No classes for this day.</div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:600">Report</div>
        <div style="font-size:0.82rem;color:#9ca3af">Per paper</div>
      </div>
      <div class="report" id="report"></div>
    </div>

    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:600">Subjects</div>
        <div style="font-size:0.82rem;color:#9ca3af">Short codes used</div>
      </div>
      <div class="subjects" id="subjects"></div>
    </div>

  </div>
</div>

<script>
/* ---------- Static weekly routine (extracted from your PDF) ---------- */
const WEEKLY_ROUTINE = {
  "Monday": [
    {start:"14:00", end:"15:00", paper:"CA&IDS", teacher:"AR/AD"},
    {start:"15:00", end:"16:00", paper:"CA II", teacher:"TKG"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"AKS"},
    {start:"18:00", end:"19:00", paper:"CB", teacher:"ASD"}
  ],
  "Tuesday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"ST"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"AKS"},
    {start:"16:00", end:"17:00", paper:"CA II", teacher:"SKD"},
    {start:"17:00", end:"18:00", paper:"CB", teacher:"RR"},
    {start:"18:00", end:"19:00", paper:"DT-I", teacher:"SKD"}
  ],
  "Wednesday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"ST"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"SKD"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"AKS"},
    {start:"18:00", end:"19:00", paper:"CB", teacher:"RR"}
  ],
  "Thursday": [
    {start:"14:00", end:"15:00", paper:"CA II", teacher:"SKD"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"SKD"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"RR"},
    {start:"17:00", end:"18:00", paper:"CB", teacher:"PS"},
    {start:"18:00", end:"19:00", paper:"Remedial", teacher:""}
  ],
  "Friday": [
    {start:"14:00", end:"15:00", paper:"CA&IDS", teacher:"AKS"},
    {start:"15:00", end:"16:00", paper:"IEE", teacher:"ST"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"CA II", teacher:"SKD"},
    {start:"18:00", end:"19:00", paper:"Remedial", teacher:""}
  ],
  "Saturday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"AB"},
    {start:"15:00", end:"16:00", paper:"Remedial", teacher:""},
    {start:"16:00", end:"17:00", paper:"CA II", teacher:"AKS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"SKD"},
    {start:"18:00", end:"19:00", paper:"TUTORIAL", teacher:"AKS"}
  ]
};

/* ---------- Attendance storage key ---------- */
const ATT_KEY = "sem3_attendance_v_final";

/* ---------- Helpers ---------- */
function toISO(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${dd}`}
const WEEKDAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function weekdayFromISO(iso){const [y,m,d]=iso.split("-").map(Number);return WEEKDAYS[new Date(y,m-1,d).getDay()]}
function formatRange(s,e){if(!s&&!e)return""; if(s&&!e) return s; if(!s&&e) return e; return `${s}–${e}`}

function loadAtt(){try{return JSON.parse(localStorage.getItem(ATT_KEY))||{}}catch(e){return{}}}
function saveAtt(m){localStorage.setItem(ATT_KEY,JSON.stringify(m))}
function statusKey(date,slot){return `${date}__${slot.start||slot.time}__${slot.paper}` }
function getStatus(date,slot){const m=loadAtt();return m[statusKey(date,slot)]||"unmarked"}
function setStatus(date,slot,status){const m=loadAtt();const k=statusKey(date,slot); if(status==="unmarked"){delete m[k]} else m[k]=status; saveAtt(m)}
function nextStatus(cur){if(cur==="unmarked")return"present"; if(cur==="present")return"absent"; return"unmarked"}

/* ---------- Render subjects list ---------- */
const subjectsEl = document.getElementById("subjects");
function renderSubjects(){
  subjectsEl.innerHTML="";
  const seen = {};
  Object.values(WEEKLY_ROUTINE).flat().forEach(s=>{
    const key = s.paper;
    if(seen[key]) return; seen[key]=1;
    const div = document.createElement("div"); div.className="sub";
    div.innerHTML = `<div class="c">${key}</div><div style="font-weight:600">${s.teacher||"—"}</div>`;
    subjectsEl.appendChild(div);
  });
}

/* ---------- Render routine for a date ---------- */
const dateInput = document.getElementById("date"), routineEl=document.getElementById("routine"), empt=document.getElementById("empt"), modeEl=document.getElementById("mode"), dayChip=document.getElementById("daychip");
function renderFor(iso){
  if(!iso) return;
  const wd = weekdayFromISO(iso);
  modeEl.textContent = wd;
  dayChip.textContent = `${wd} · ${iso}`;
  const list = (WEEKLY_ROUTINE[wd]||[]).slice();
  routineEl.innerHTML = "";
  if(!list.length){empt.style.display="block"; return} empt.style.display="none";
  list.forEach(slot=>{
    const row = document.createElement("div"); row.className="row";
    const left = document.createElement("div"); left.innerHTML = `<div class="time">${formatRange(slot.start,slot.end)}</div><div class="code">${slot.paper}</div>`;
    const mid = document.createElement("div"); mid.innerHTML = `<div style="font-weight:600">${slot.paper}</div><div class="meta">${slot.teacher||"—"}</div>`;
    const right = document.createElement("div");
    const btn = document.createElement("button"); btn.className="status";
    let st = getStatus(iso,slot);
    applyBtn(btn,st);
    btn.onclick = ()=>{ st=nextStatus(st); setStatus(iso,slot,st); applyBtn(btn,st); buildReport(); }
    right.appendChild(btn);
    row.appendChild(left); row.appendChild(mid); row.appendChild(right);
    routineEl.appendChild(row);
  });
}
function applyBtn(btn,status){
  btn.className="status";
  if(status==="present"){btn.classList.add("s-p"); btn.textContent="P"}
  else if(status==="absent"){btn.classList.add("s-a"); btn.textContent="A"}
  else {btn.classList.add("s-u"); btn.textContent="–"}
}

/* ---------- Report ---------- */
const reportEl = document.getElementById("report");
function buildReport(){
  const map = loadAtt(); const entries = Object.entries(map);
  if(!entries.length){ reportEl.innerHTML=`<div style="color:#9ca3af">No data yet.</div>`; return }
  const stats = {}; let op=0,oa=0;
  for(const [k,v] of entries){ if(v!=="present" && v!=="absent") continue; const parts=k.split("__"); if(parts.length!==3) continue; const paper=parts[2]; if(!stats[paper]) stats[paper]={present:0,absent:0}; stats[paper][v]++; if(v==="present")op++; if(v==="absent")oa++; }
  if(Object.keys(stats).length===0){ reportEl.innerHTML=`<div style="color:#9ca3af">Only unmarked entries.</div>`; return }
  let html='<table><thead><tr><th>Paper</th><th>P</th><th>A</th><th>%</th></tr></thead><tbody>';
  Object.keys(stats).forEach(p=>{
    const s=stats[p]; const t=s.present+s.absent; const pct = t? Math.round((s.present/t)*100):0;
    html+=`<tr><td>${p}</td><td>${s.present}</td><td>${s.absent}</td><td>${pct}%</td></tr>`;
  });
  const total = op+oa; const overall = total?Math.round((op/total)*100):0;
  html += `</tbody><tfoot><tr><td>Total</td><td>${op}</td><td>${oa}</td><td>${overall}%</td></tr></tfoot></table>`;
  reportEl.innerHTML = html;
}

/* ---------- Weekday buttons / date logic ---------- */
function setToday(){ const d=new Date(); const iso = toISO(d); dateInput.value=iso; renderFor(iso); highlight(weekdayFromISO(iso)); buildReport() }
function highlight(wd){ document.querySelectorAll('.wd').forEach(e=> e.classList.toggle('active', e.dataset.day===wd)); }
document.getElementById("today").addEventListener("click", ()=>{ setToday(); });
document.querySelectorAll('.wd').forEach(b=> b.addEventListener('click', (ev)=>{ const day=ev.currentTarget.dataset.day; highlight(day); const today=new Date(); const mon = (d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const day=x.getDay(); const diff=(day+6)%7; x.setDate(x.getDate()-diff); return x})(today); const offset = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].indexOf(day); mon.setDate(mon.getDate()+offset); const iso=toISO(mon); dateInput.value=iso; renderFor(iso); buildReport(); }));
dateInput.addEventListener('change', ()=>{ const v=dateInput.value; if(!v) return; renderFor(v); highlight(weekdayFromISO(v)); buildReport(); });

/* ---------- Initial render ---------- */
renderSubjects();
setToday();
buildReport();

</script>
</body>
</html>
