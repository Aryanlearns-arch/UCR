<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sem 3 · Routine (Preloaded)</title>
<style>
  :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#020617;color:#e5e7eb;display:flex;justify-content:center;min-height:100vh}
  .app{width:100%;max-width:920px;padding:18px}
  .card{background:#020617;border-radius:16px;padding:16px;border:1px solid rgba(148,163,184,0.22);box-shadow:0 16px 36px rgba(0,0,0,0.55)}
  header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
  h1{margin:0;font-size:1.2rem}
  .tag{font-size:0.78rem;color:#9ca3af}
  .pill{font-size:0.72rem;padding:6px 10px;border-radius:999px;border:1px solid rgba(129,140,248,0.7);color:#c7d2fe}
  .controls{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  label{font-size:0.75rem;color:#9ca3af}
  input[type=date]{padding:6px 8px;border-radius:10px;border:1px solid #374151;background:#020617;color:#e5e7eb}
  .btn{padding:6px 10px;border-radius:999px;border:1px solid #374151;background:#020617;color:#e5e7eb;cursor:pointer}
  .weekday-row{display:flex;gap:6px;margin-bottom:10px;overflow:auto}
  .weekday{padding:6px 10px;border-radius:999px;border:1px solid #374151;background:#020617;color:#9ca3af;cursor:pointer}
  .weekday.active{border-color:#6366f1;background:rgba(79,70,229,0.22);color:#e5e7eb}
  .section{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:0.92rem}
  .legend{display:flex;gap:8px;color:#9ca3af;font-size:0.76rem;margin-bottom:6px}
  .routine{border-radius:10px;border:1px solid #111827;padding:6px;max-height:360px;overflow:auto;background:linear-gradient(180deg,rgba(10,14,24,0.6),#020617)}
  .row{display:grid;grid-template-columns:1.1fr 2.2fr auto;gap:8px;padding:8px;border-bottom:1px solid rgba(17,24,39,0.6);align-items:center;font-size:0.86rem}
  .row:last-child{border-bottom:none}
  .time{font-weight:600}
  .code{color:#a5b4fc;font-size:0.78rem}
  .meta{font-size:0.72rem;color:#9ca3af}
  .status{padding:4px 8px;border-radius:999px;border:1px solid #374151;background:#020617;min-width:64px;text-align:center;cursor:pointer}
  .unmarked{border-style:dashed;color:#9ca3af}
  .present{background:rgba(34,197,94,0.18);border-color:#22c55e;color:#bbf7d0}
  .absent{background:rgba(239,68,68,0.14);border-color:#ef4444;color:#fecaca}
  .report{margin-top:8px;border-radius:10px;border:1px solid #111827;padding:8px;font-size:0.86rem}
  table{width:100%;border-collapse:collapse}
  th,td{padding:6px 8px;border-bottom:1px solid #111827;text-align:left}
  th{font-size:0.78rem;color:#9ca3af}
  .empty{padding:12px;color:#9ca3af;text-align:center}
  @media (max-width:640px){.row{grid-template-columns:1fr 1.8fr auto}}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <header>
      <div>
        <h1>Sem 3 · Routine</h1>
        <div class="tag">Preloaded from your PDF (Sem 3). Tap P/A to mark.</div>
      </div>
      <div class="pill">Local · Offline</div>
    </header>

    <div class="controls">
      <div>
        <label>Date</label><br />
        <input type="date" id="date" />
      </div>
      <div style="min-width:140px">
        <label>&nbsp;</label><br />
        <button class="btn" id="today">Today</button>
      </div>
      <div style="min-width:160px">
        <label>Day</label><br />
        <div id="dayChip" style="padding:6px 10px;border-radius:999px;border:1px solid #374151;background:#020617;color:#9ca3af">-</div>
      </div>
    </div>

    <div class="weekday-row" id="weekdayRow">
      <div class="weekday" data-day="Monday">Mon</div>
      <div class="weekday" data-day="Tuesday">Tue</div>
      <div class="weekday" data-day="Wednesday">Wed</div>
      <div class="weekday" data-day="Thursday">Thu</div>
      <div class="weekday" data-day="Friday">Fri</div>
      <div class="weekday" data-day="Saturday">Sat</div>
    </div>

    <div class="section">
      <div>Classes</div>
      <div id="mode" class="meta"></div>
    </div>

    <div class="legend"><span><b style="color:#22c55e">●</b> P</span><span><b style="color:#ef4444">●</b> A</span><span>– unmarked</span></div>

    <div class="routine" id="routine"></div>
    <div class="empty" id="noClasses" style="display:none">No classes for this day.</div>

    <div class="section" style="margin-top:12px"><div>Report</div><div class="meta">Per paper</div></div>
    <div class="report" id="report"></div>

    <div style="margin-top:12px;font-size:0.78rem;color:#9ca3af">Source: timetable PDF (Sem 3) — teachers shown as short codes. Parsed from pages 1–2. 1</div>
  </div>
</div>

<script>
/* -------------------------
   PRELOADED WEEKLY ROUTINE
   extracted from your PDF (Sem 3)
   times are the table columns: 2:00-3:00 ... 6:00-7:00
   teacher codes kept exactly as in PDF.
   Source pages: 1–2 (your uploaded file). 2
   ------------------------- */
const WEEKLY = {
  "Monday": [
    {start:"14:00", end:"15:00", paper:"CA&IDS", teacher:"AR/AD"},
    {start:"15:00", end:"16:00", paper:"CA II", teacher:"TKG"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"AKS"},
    {start:"18:00", end:"19:00", paper:"CB", teacher:"ASD"}
  ],
  "Tuesday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"ST"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"AKS"},
    {start:"16:00", end:"17:00", paper:"CA II", teacher:"SKD"},
    {start:"17:00", end:"18:00", paper:"CB", teacher:"RR"},
    {start:"18:00", end:"19:00", paper:"DT-I", teacher:"SKD"}
  ],
  "Wednesday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"ST"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"SKD"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"AKS"},
    {start:"18:00", end:"19:00", paper:"CB", teacher:"RR"}
  ],
  "Thursday": [
    {start:"14:00", end:"15:00", paper:"CA II", teacher:"SKD"},
    {start:"15:00", end:"16:00", paper:"CA&IDS", teacher:"SKD"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"RR"},
    {start:"17:00", end:"18:00", paper:"CB", teacher:"PS"},
    {start:"18:00", end:"19:00", paper:"Remedial", teacher:""}
  ],
  "Friday": [
    {start:"14:00", end:"15:00", paper:"CA&IDS", teacher:"AKS"},
    {start:"15:00", end:"16:00", paper:"IEE", teacher:"ST"},
    {start:"16:00", end:"17:00", paper:"CB", teacher:"PS"},
    {start:"17:00", end:"18:00", paper:"CA II", teacher:"SKD"},
    {start:"18:00", end:"19:00", paper:"Remedial", teacher:""}
  ],
  "Saturday": [
    {start:"14:00", end:"15:00", paper:"IEE", teacher:"AB"},
    {start:"15:00", end:"16:00", paper:"Remedial", teacher:""},
    {start:"16:00", end:"17:00", paper:"CA II", teacher:"AKS"},
    {start:"17:00", end:"18:00", paper:"DT-I", teacher:"SKD"},
    {start:"18:00", end:"19:00", paper:"Tutorial", teacher:"AKS"}
  ]
};

/* storage keys */
const ATT_KEY = "sem3_mock_attendance_v1";

/* --- helpers --- */
function toISO(d){ return d.toISOString().slice(0,10) }
function weekdayFromISO(iso){ const [y,m,d]=iso.split("-").map(Number); return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][new Date(y,m-1,d).getDay()]; }
function statusKey(date,slot){ return `${date}__${slot.start}__${slot.paper}`; }
function getMap(){ try{ return JSON.parse(localStorage.getItem(ATT_KEY)||"{}") }catch(e){return{}} }
function setMap(m){ localStorage.setItem(ATT_KEY, JSON.stringify(m)) }
function next(s){ return s==="unmarked"?"present": s==="present"?"absent":"unmarked" }
function applyStyle(btn,s){ btn.classList.remove("unmarked","present","absent"); if(s==="present"){btn.classList.add("present"); btn.textContent="P"} else if(s==="absent"){btn.classList.add("absent"); btn.textContent="A"} else {btn.classList.add("unmarked"); btn.textContent="–"} }

/* --- render subjects (simple) --- */
function renderRoutineFor(iso){
  const wd = weekdayFromISO(iso);
  const list = WEEKLY[wd]||[];
  document.getElementById("dayChip").textContent = `${wd} · ${iso}`;
  document.getElementById("mode").textContent = wd;
  const container = document.getElementById("routine");
  container.innerHTML = "";
  if(!list.length){ document.getElementById("noClasses").style.display="block"; return } else { document.getElementById("noClasses").style.display="none" }
  list.forEach(slot=>{
    const row=document.createElement("div"); row.className="row";
    const left=document.createElement("div"); left.innerHTML=`<div class="time">${slot.start} – ${slot.end}</div><div class="code">${slot.paper}</div>`;
    const mid=document.createElement("div"); mid.innerHTML=`<div style="font-weight:600">${slot.teacher ? slot.teacher : ""}</div><div class="meta">${slot.teacher?'' : ''}</div><div class="meta">${slot.teacher?slot.teacher:''}</div><div class="meta">${''}</div>`;
    const info=document.createElement("div"); 
    const btn=document.createElement("button"); btn.className="status"; 
    const m = getMap(); const key=statusKey(iso,slot); const st = m[key]||"unmarked"; applyStyle(btn,st);
    btn.addEventListener("click",()=>{
      const cur = getMap(); const k=key; const newStatus = next(cur[k]||"unmarked");
      if(newStatus==="unmarked"){ delete cur[k] } else { cur[k]=newStatus }
      setMap(cur); applyStyle(btn,newStatus); buildReport();
    });
    info.appendChild(btn);
    row.appendChild(left); row.appendChild(mid); row.appendChild(info);
    container.appendChild(row);
    // add small teacher line in mid properly:
    mid.innerHTML = `<div style="font-weight:600">${slot.paper}</div><div class="meta">${slot.teacher ? slot.teacher : ""}</div>`;
  });
}

/* --- report --- */
function buildReport(){
  const m = getMap(); const entries = Object.entries(m);
  const out = document.getElementById("report");
  if(!entries.length){ out.innerHTML = '<div class="empty">No attendance marked yet.</div>'; return }
  const stats = {}; let op=0, oa=0;
  for(const [k,v] of entries){
    if(!(v==="present"||v==="absent")) continue;
    const parts=k.split("__"); if(parts.length<3) continue;
    const paper = parts[2];
    if(!stats[paper]) stats[paper]={present:0,absent:0};
    stats[paper][v]++; if(v==="present") op++; if(v==="absent") oa++;
  }
  if(Object.keys(stats).length===0){ out.innerHTML = '<div class="empty">Only unmarked entries.</div>'; return }
  let html='<table><thead><tr><th>Paper</th><th>P</th><th>A</th><th>%</th></tr></thead><tbody>';
  Object.keys(stats).forEach(p=>{
    const s=stats[p]; const t=s.present+s.absent; const pct = t?Math.round((s.present/t)*100):0;
    html += `<tr><td>${p}</td><td>${s.present}</td><td>${s.absent}</td><td>${pct}%</td></tr>`;
  });
  const total = op+oa; const totPct = total?Math.round((op/total)*100):0;
  html += `</tbody><tfoot><tr><td>Total</td><td>${op}</td><td>${oa}</td><td>${totPct}%</td></tr></tfoot></table>`;
  out.innerHTML = html;
}

/* --- date controls + weekday buttons --- */
function setToday(){
  const d=new Date(); const iso=toISO(d);
  document.getElementById("date").value=iso; renderRoutineFor(iso); highlight(weekdayFromISO(iso)); buildReport();
}
function highlight(w){
  document.querySelectorAll(".weekday").forEach(el=>el.classList.toggle("active", el.dataset.day===w));
}
document.getElementById("today").addEventListener("click", setToday);
document.getElementById("date").addEventListener("change",(e)=>{ const iso=e.target.value; if(!iso) return; renderRoutineFor(iso); highlight(weekdayFromISO(iso)); buildReport(); });

document.querySelectorAll(".weekday").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const w=btn.dataset.day;
    const now=new Date(); const dow=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].indexOf(w);
    // find this week's date for that weekday
    const curDow = now.getDay(); // 0 Sun .. 6 Sat
    // compute Monday of current week
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = (curDow + 6) % 7;
    monday.setDate(monday.getDate() - diff + dow);
    const iso = toISO(monday);
    document.getElementById("date").value=iso;
    renderRoutineFor(iso); highlight(w); buildReport();
  });
});

/* init */
document.addEventListener("DOMContentLoaded", ()=>{
  // default subjects shown by code itself; render today
  setToday();
  buildReport();
});
</script>
</body>
</html>
