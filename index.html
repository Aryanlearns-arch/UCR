<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sem 3 · Class Routine</title>

<style>
  :root {
    color-scheme: dark;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  }

  body {
    margin: 0;
    background: #020617;
    color: #e5e7eb;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .app {
    width: 100%;
    max-width: 900px;
    padding: 16px;
  }

  .card {
    background: #020617;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  h1 {
    margin: 0;
    font-size: 1.2rem;
  }

  .muted {
    font-size: 0.8rem;
    color: #9ca3af;
  }

  .pill {
    font-size: 0.7rem;
    padding: 6px 10px;
    border-radius: 999px;
    border: 1px solid #334155;
    color: #c7d2fe;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 14px;
  }

  label {
    font-size: 0.75rem;
    color: #9ca3af;
  }

  input[type="date"] {
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid #374151;
    background: #020617;
    color: #e5e7eb;
    font-size: 0.9rem;
    min-height: 42px;
    position: relative;
    z-index: 10;
  }

  button {
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid #374151;
    background: transparent;
    color: #e5e7eb;
    cursor: pointer;
    font-size: 0.8rem;
  }

  .weekday-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 12px;
  }

  .day-btn {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #374151;
    font-size: 0.75rem;
    color: #9ca3af;
    cursor: pointer;
    white-space: nowrap;
  }

  .day-btn.active {
    background: rgba(99,102,241,0.25);
    color: #e5e7eb;
    border-color: #6366f1;
  }

  .section {
    margin-top: 16px;
  }

  .section-title {
    font-size: 0.9rem;
    margin-bottom: 6px;
  }

  .routine {
    border: 1px solid #1f2937;
    border-radius: 12px;
    overflow: hidden;
  }

  .class-row {
    display: grid;
    grid-template-columns: 1.2fr 2.5fr auto;
    gap: 8px;
    padding: 10px;
    border-bottom: 1px solid #111827;
    align-items: center;
    font-size: 0.85rem;
  }

  .class-row:last-child {
    border-bottom: none;
  }

  .time {
    font-weight: 600;
  }

  .code {
    font-size: 0.75rem;
    color: #a5b4fc;
  }

  .meta {
    font-size: 0.75rem;
    color: #9ca3af;
  }

  .status {
    min-width: 50px;
    text-align: center;
    border-radius: 999px;
    padding: 4px 8px;
    border: 1px dashed #374151;
    cursor: pointer;
    font-size: 0.75rem;
  }

  .present {
    border-style: solid;
    border-color: #22c55e;
    background: rgba(34,197,94,0.2);
    color: #bbf7d0;
  }

  .absent {
    border-style: solid;
    border-color: #ef4444;
    background: rgba(239,68,68,0.2);
    color: #fecaca;
  }

  .subjects {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 10px;
  }

  .subject-card {
    border: 1px solid #1f2937;
    border-radius: 10px;
    padding: 8px;
    font-size: 0.8rem;
  }

  .report table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .report th, .report td {
    padding: 6px;
    border-bottom: 1px solid #111827;
    text-align: left;
  }

  .report th {
    color: #9ca3af;
  }
</style>
</head>

<body>
<div class="app">
<div class="card">

<header>
  <div>
    <h1>Sem 3 · Routine</h1>
    <div class="muted">Fixed schedule · Local attendance</div>
  </div>
  <div class="pill">Offline</div>
</header>

<div class="controls">
  <div>
    <label>Date</label><br>
    <input type="date" id="datePicker">
  </div>
  <div>
    <label>&nbsp;</label><br>
    <button id="todayBtn">Today</button>
  </div>
  <div>
    <label>Day</label><br>
    <div id="dayLabel" class="pill">—</div>
  </div>
</div>

<div class="weekday-bar" id="weekdayBar"></div>

<div class="section">
  <div class="section-title">Classes</div>
  <div class="routine" id="routine"></div>
</div>

<div class="section">
  <div class="section-title">Attendance Report</div>
  <div class="report" id="report"></div>
</div>

<div class="section">
  <div class="section-title">Subjects</div>
  <div class="subjects" id="subjects"></div>
</div>

</div>
</div>

<script>
/* ---------- DATA ---------- */
const SUBJECTS = {
  "CA II": "Cost Accounting II",
  "DT-I": "Direct Tax – I",
  "CB": "Consumer Behaviour",
  "IEE": "Indian Economic Environment",
  "CA&IDS": "Computerized Accounting & Intro to Data Science",
  "Remedial": "Remedial Class",
  "TUTORIAL": "Tutorial"
};

const ROUTINE = {
  "Monday": [
    ["14:00","15:00","CA&IDS","AR/AD"],
    ["15:00","16:00","CA II","TKG"],
    ["16:00","17:00","CB","PS"],
    ["17:00","18:00","DT-I","AKS"],
    ["18:00","19:00","CB","ASD"]
  ],
  "Tuesday": [
    ["14:00","15:00","IEE","ST"],
    ["15:00","16:00","CA&IDS","AKS"],
    ["16:00","17:00","CA II","SKD"],
    ["17:00","18:00","CB","RR"],
    ["18:00","19:00","DT-I","SKD"]
  ],
  "Wednesday": [
    ["14:00","15:00","IEE","ST"],
    ["15:00","16:00","CA&IDS","SKD"],
    ["16:00","17:00","CB","PS"],
    ["17:00","18:00","DT-I","AKS"],
    ["18:00","19:00","CB","RR"]
  ],
  "Thursday": [
    ["14:00","15:00","CA II","SKD"],
    ["15:00","16:00","CA&IDS","SKD"],
    ["16:00","17:00","CB","RR"],
    ["17:00","18:00","CB","PS"],
    ["18:00","19:00","Remedial",""]
  ],
  "Friday": [
    ["14:00","15:00","CA&IDS","AKS"],
    ["15:00","16:00","IEE","ST"],
    ["16:00","17:00","CB","PS"],
    ["17:00","18:00","CA II","SKD"],
    ["18:00","19:00","Remedial",""]
  ],
  "Saturday": [
    ["14:00","15:00","IEE","AB"],
    ["15:00","16:00","Remedial",""],
    ["16:00","17:00","CA II","AKS"],
    ["17:00","18:00","DT-I","SKD"],
    ["18:00","19:00","TUTORIAL","AKS"]
  ]
};

const ATT_KEY = "sem3_att";

/* ---------- LOGIC ---------- */
const datePicker = document.getElementById("datePicker");
const routineEl = document.getElementById("routine");
const reportEl = document.getElementById("report");
const dayLabel = document.getElementById("dayLabel");
const weekdayBar = document.getElementById("weekdayBar");

const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function iso(d){return d.toISOString().slice(0,10);}
function weekday(iso){return new Date(iso).toLocaleDateString("en-US",{weekday:"long"});}

function loadAtt(){return JSON.parse(localStorage.getItem(ATT_KEY)||"{}");}
function saveAtt(d){localStorage.setItem(ATT_KEY,JSON.stringify(d));}

function render(date){
  const day = weekday(date);
  dayLabel.textContent = `${day} · ${date}`;
  routineEl.innerHTML = "";

  (ROUTINE[day]||[]).forEach(cls=>{
    const key = date+"_"+cls[0]+"_"+cls[2];
    const att = loadAtt()[key] || "";

    const row = document.createElement("div");
    row.className = "class-row";
    row.innerHTML = `
      <div>
        <div class="time">${cls[0]}–${cls[1]}</div>
        <div class="code">${cls[2]}</div>
      </div>
      <div>
        <div>${SUBJECTS[cls[2]]}</div>
        <div class="meta">${cls[3] || "—"}</div>
      </div>
      <div class="status ${att}" data-key="${key}">${att==="present"?"P":att==="absent"?"A":"–"}</div>
    `;
    routineEl.appendChild(row);
  });

  document.querySelectorAll(".status").forEach(btn=>{
    btn.onclick = ()=>{
      const m = loadAtt();
      const k = btn.dataset.key;
      m[k] = m[k]==="present"?"absent":m[k]==="absent"?"": "present";
      saveAtt(m);
      render(date);
      report();
    };
  });
}

function report(){
  const m = loadAtt();
  const stats = {};
  Object.values(m).forEach(v=>{
    if(!v) return;
    stats[v] = (stats[v]||0)+1;
  });
  reportEl.innerHTML = `
    <table>
      <tr><th>Present</th><th>Absent</th></tr>
      <tr><td>${stats.present||0}</td><td>${stats.absent||0}</td></tr>
    </table>`;
}

function init(){
  DAYS.forEach(d=>{
    const b=document.createElement("div");
    b.className="day-btn";
    b.textContent=d.slice(0,3);
    b.onclick=()=>{
      const today=new Date();
      while(today.toLocaleDateString("en-US",{weekday:"long"})!==d) today.setDate(today.getDate()+1);
      datePicker.value=iso(today);
      render(datePicker.value);
    };
    weekdayBar.appendChild(b);
  });

  const today=new Date();
  datePicker.value=iso(today);
  render(datePicker.value);
  report();
}

document.getElementById("todayBtn").onclick=()=>{
  const t=new Date();
  datePicker.value=iso(t);
  render(datePicker.value);
};

datePicker.onclick=()=>datePicker.showPicker && datePicker.showPicker();
datePicker.onchange=()=>render(datePicker.value);

init();
</script>

</body>
</html>
